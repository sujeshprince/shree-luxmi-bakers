name: Deploy to GitHub Pages

# Builds the Next.js static export and publishes it to GitHub Pages.
# The site is served under https://sujeshprince.github.io/shree-luxmi-bakers/

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Enable Pages (source: GitHub Actions) automatically on first run.
          enablement: true

      - name: Build static export
        env:
          # Repository sub-path + absolute URL for this Pages deployment.
          NEXT_PUBLIC_BASE_PATH: /shree-luxmi-bakers
          NEXT_PUBLIC_SITE_URL: https://sujeshprince.github.io/shree-luxmi-bakers
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4